[versions]
# Libraries
asm = "9.11.1"
jetbrains-annotations = "26.1.0"
junit = "6.1.3"
slf4j = "2.0.20"
typesafe-config = "1.4.10"

# Plugins
gradleup-shadow = "9.6.1"
vanniktech-maven-publish = "0.37.0"

[libraries]
asm-tree = { module = "org.ow2.asm:asm-tree", version.ref = "asm" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrains-annotations" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform = { module = "org.junit.platform:junit-platform-launcher" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
typesafe-config = { module = "com.typesafe:config", version.ref = "typesafe-config" }

[plugins]
gradleup-shadow = { id = "com.gradleup.shadow", version.ref = "gradleup-shadow" }
vanniktech-maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktech-maven-publish" }